<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Place radio relays on the 16 km Malapert map and simulate links, coverage and data rate.">
<title>Malapert Node Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=Saira+Semi+Condensed:wght@600;700&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Map fills the window; a console rail on the left, or a sheet below it on a phone. Regolith neutrals, Kapton gold for action. */
:root {
  --bg: #e7e9e8; --panel: #f3f4f2; --raised: #ffffff; --ink: #14181c; --ink2: #49525a; --ink3: #6b747c; --rule: #cfd4d3;
  --gold: #8a5a00; --gold-fill: #c68a1e; --on-gold: #15110a; --good: #17693f; --warn: #8f5300; --bad: #b3261e; --stale: #7a4d00;
  --note-ok: #dcebe0; --note-mid: #efe6d0; --note-bad: #f4dcd8;
  --display: "Saira Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "B612", "Segoe UI", system-ui, sans-serif;
  --mono: "B612", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --panel: #191e23; --raised: #222931; --ink: #e9ecee; --ink2: #b4bcc3; --ink3: #8f98a0; --rule: #333c44;
    --gold: #e6b04a; --gold-fill: #d79a2b; --on-gold: #15110a; --good: #6fce99; --warn: #e9b35a; --bad: #f08a80; --stale: #e6b04a;
    --note-ok: #1f3329; --note-mid: #352c1a; --note-bad: #3c2220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161a; --panel: #191e23; --raised: #222931; --ink: #e9ecee; --ink2: #b4bcc3; --ink3: #8f98a0; --rule: #333c44;
  --gold: #e6b04a; --gold-fill: #d79a2b; --on-gold: #15110a; --good: #6fce99; --warn: #e9b35a; --bad: #f08a80; --stale: #e6b04a;
  --note-ok: #1f3329; --note-mid: #352c1a; --note-bad: #3c2220; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 13.5px; line-height: 1.45; overflow: hidden; }
* { box-sizing: border-box; }
.app { display: grid; grid-template-columns: 372px minmax(0, 1fr); height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.mast { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.mast h1 { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: 0.01em; margin: 0; line-height: 1.1; }
.mast p { margin: 0; color: var(--ink2); font-size: 12px; }
#simulate { background: var(--gold-fill); color: var(--on-gold); border: 0; border-radius: 3px; font: 600 16px var(--display); letter-spacing: 0.03em; padding: 9px 12px; cursor: pointer; min-height: 42px; }
#simulate:disabled { opacity: 0.6; cursor: progress; }
.status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink2); min-height: 20px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 2px; border: 1px solid currentColor; }
.chip.stale { color: var(--stale); }
.chip.fresh { color: var(--good); }
.bar { height: 3px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold-fill); }
.scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; }
section { padding: 12px 16px 14px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink2); margin: 0; }
.caveat { font-size: 12px; background: var(--note-mid); padding: 7px 9px; border-radius: 3px; }
.caveat b { font-family: var(--display); letter-spacing: 0.02em; }
.valid { font-size: 12px; padding: 7px 9px; border-radius: 3px; }
.valid b { font-family: var(--display); letter-spacing: 0.02em; display: block; }
.valid.ok { background: var(--note-ok); } .valid.mid { background: var(--note-mid); } .valid.none { background: var(--note-bad); }
.readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.ro span { display: block; font-size: 11px; color: var(--ink3); }
.ro strong { font-family: var(--mono); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; }
.readouts.dim { opacity: 0.55; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--ink2); }
select, input[type="number"] { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 7px; width: 100%; min-width: 0; }
input[type="range"] { width: 100%; accent-color: var(--gold-fill); margin: 0; }
.rowf { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 12px; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 9px; cursor: pointer; }
.autop { display: grid; gap: 6px; }
.autof { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); font-weight: 700; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.ov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; font-size: 12.5px; }
.ov label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.nodes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.node { border: 1px solid var(--rule); border-radius: 3px; background: var(--raised); padding: 7px 9px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; min-width: 0; }
.node.sel { border-color: var(--gold); }
.node .t { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.node .id { font-family: var(--display); font-weight: 700; font-size: 15px; }
.node .pos { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); }
.node .st { font-size: 12px; }
.tag { font-family: var(--mono); font-size: 11.5px; display: block; }
.tag.good { color: var(--good); } .tag.warn { color: var(--warn); } .tag.bad { color: var(--bad); }
.node .ctl { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px; align-items: center; }
.node .ctl input { padding: 3px 5px; font-family: var(--mono); }
.node .x { display: flex; gap: 6px; justify-content: flex-end; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 400; color: var(--ink3); font-size: 11px; padding: 2px 8px 2px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 3px 8px 3px 0; border-bottom: 1px solid var(--rule); font-family: var(--mono); white-space: nowrap; }
td.w { white-space: normal; font-family: var(--body); }
details summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink2); }
details p, details ul { margin: 6px 0 0; font-size: 12.5px; max-width: 62ch; }
details ul { padding-left: 16px; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: #0b0e11; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.legend { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(13, 17, 21, 0.86); color: #e9ecee; padding: 7px 9px; border-radius: 3px; font-size: 11px; display: grid; gap: 3px; max-width: min(250px, calc(100% - 20px)); pointer-events: none; }
.legend b { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.02em; }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 11px; display: inline-block; flex: none; }
.maptop { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; justify-items: end; }
.maptop button { font: 600 15px var(--mono); width: 32px; height: 32px; background: rgba(13, 17, 21, 0.86); color: #e9ecee; border: 1px solid rgba(233, 236, 238, 0.3); border-radius: 3px; cursor: pointer; }
.read { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); background: rgba(13, 17, 21, 0.86); color: #e9ecee; padding: 4px 8px; border-radius: 3px; font-size: 11.5px; font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(100% - 70px); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); top: calc(40px + env(safe-area-inset-top, 0px)); background: rgba(13, 17, 21, 0.86); color: #e9ecee; padding: 4px 10px; border-radius: 3px; font-size: 12px; pointer-events: none; max-width: calc(100% - 110px); }
.placing #map { cursor: crosshair; }
.banner { position: absolute; left: 0; right: 0; top: 0; background: rgba(120, 30, 24, 0.95); color: #fff; padding: 10px 14px; font-size: 13px; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 54%) minmax(0, 46%); }
  .mapwrap { grid-row: 1; }
  .rail { grid-row: 2; border-right: 0; border-top: 1px solid var(--rule); overflow-y: auto; display: block; }
  .scroll { overflow: visible; }
  .mast { padding: 10px 16px; }
  .mast h1 { font-size: 18px; }
  .mast p.sub { display: none; }
  .legend { font-size: 10px; max-width: 150px; padding: 5px 7px; gap: 2px; }
  .legend .opt { display: none; }
  .legend b { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<!-- Page markup: console rail and map, assembled into index.html by build_page.py. -->
<div class="app" id="app">
  <aside class="rail" aria-label="Controls and results">
    <div class="mast">
      <h1>Malapert Node Planner</h1>
      <p class="sub">Place relays on the 16 km Malapert map, then simulate the links back to the summit base.</p>
      <button id="simulate" type="button">Simulate</button>
      <div class="status"><span id="chip" class="chip stale">Loading</span><span id="stat">Loading terrain</span></div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="scroll">
      <section aria-label="Result">
        <h2>Result</h2>
        <div class="readouts" id="rd">
          <div class="ro"><span>Relays connected to base</span><strong id="r-conn">–</strong></div>
          <div class="ro"><span>Weakest chain hop</span><strong id="r-weak">–</strong></div>
          <div class="ro"><span>Reliable area</span><strong id="r-area">–</strong></div>
          <div class="ro"><span>Route out of contact</span><strong id="r-out">–</strong></div>
        </div>
      </section>
      <section aria-label="Plan">
        <h2>Plan</h2>
        <div class="btns">
          <button id="add" class="btn" type="button" aria-pressed="false">Add relay</button>
          <button id="clear" class="btn" type="button">Remove all relays</button>
        </div>
        <div class="autop">
          <div class="btns">
            <button id="auto" class="btn" type="button" aria-pressed="false">Find fewest relays to a point</button>
            <button id="draw" class="btn" type="button" aria-pressed="false">Draw route</button>
            <button id="undo" class="btn" type="button" hidden>Undo point</button>
          </div>
          <div class="autof">
            <label class="f">Mast, m
              <input id="auto-h" type="number" min="0.5" max="30" step="0.5" value="1.5">
            </label>
            <label class="f">Extra margin, dB
              <input id="auto-x" type="number" min="0" max="20" step="1" value="0">
            </label>
          </div>
        </div>
      </section>
      <section aria-label="Radio">
        <h2>Radio</h2>
        <label class="f">Preset
          <select id="preset"></select>
        </label>
        <label class="f" for="freq">Free frequency</label>
        <input id="freq" type="range" min="0" max="1000" step="1" aria-label="Frequency, 50 MHz to 3.5 GHz">
        <div class="rowf"><span>50 MHz</span><span id="freq-v">433 MHz</span><span>3.5 GHz</span></div>
        <label class="f" id="target-wrap" hidden>Rate to hold on the slider
          <select id="target">
            <option value="1758">1.76 kb/s, the SF9 rate</option>
            <option value="10000">10 kb/s</option>
            <option value="100000">100 kb/s</option>
            <option value="1000000">1 Mb/s</option>
          </select>
        </label>
        <label class="f">Link budget
          <select id="budget">
            <option value="10">Study: 10 dB fade margin</option>
            <option value="22.5">Cautious: 22.5 dB fade margin</option>
          </select>
        </label>
        <div class="rowf"><span id="budget-note"></span></div>
        <label class="f">Crew antenna height, m
          <input id="crewh" type="number" min="0.5" max="5" step="0.1" value="1.5">
        </label>
      </section>
      <section aria-label="Sites">
        <h2>Sites</h2>
        <div id="nodes" class="nodes"></div>
      </section>
      <section aria-label="Links">
        <h2>Links</h2>
        <div class="tbl" id="links"></div>
      </section>
      <section aria-label="Map layers">
        <h2>Map layer</h2>
        <div class="ov" role="radiogroup" aria-label="Map layer">
          <label><input type="radio" name="ov" value="coverage" id="ov-cov" checked>Coverage</label>
          <label><input type="radio" name="ov" value="slope" id="ov-slope">Slope</label>
          <label><input type="radio" name="ov" value="winter" id="ov-winter">Winter sun</label>
          <label><input type="radio" name="ov" value="none" id="ov-none">Terrain only</label>
        </div>
        <div class="ov">
          <label><input type="checkbox" id="t-psr">PSRs</label>
          <label><input type="checkbox" id="t-route" checked>Route</label>
        </div>
      </section>
    </div>
  </aside>
  <div class="mapwrap" id="wrap">
    <canvas id="map" role="img" aria-label="Hillshade map of Malapert with radio coverage, relays, links and route"></canvas>
    <div class="legend" id="legend"></div>
    <div class="read" id="read" hidden></div>
    <div class="maptop"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button></div>
    <div class="hint" id="hint" hidden></div>
  </div>
</div>
<script id="engine-src">
// R2 hybrid link model, P.526 chain, radial coverage sweep, mesh and rate functions; runs under Node, in the page and in a Web Worker.
"use strict";
var LL = (function () {
  var C0 = 299792458.0, R_MOON = 1737400.0, EPS_REG = 2.5, TAND_REG = 0.004, EPS0 = 8.8541878128e-12;
  var FINAL = { lmin: 30.0, gap: 200.0, q: 0.5, rmax: 20000.0 };
  var LOG10 = Math.log(10), PI = Math.PI;

  function log10(x) { return Math.log(x) / LOG10; }
  function sigma(f) { return 2 * PI * f * EPS0 * EPS_REG * TAND_REG; }
  function J(v) {
    if (!(v > -0.78)) return 0;
    var a = v - 0.1;
    return 6.9 + 20 * log10(Math.sqrt(a * a + 1) + a);
  }
  function roundEven(x) {
    var r = Math.round(x);
    if (Math.abs(x - Math.trunc(x)) === 0.5 && r % 2 !== 0) r -= 1;
    return r;
  }
  function mapScale(x, y) { var t2 = (x * x + y * y) / (4 * R_MOON * R_MOON); return 1 + t2; }

  // ---- P.526 smooth sphere, sec. 3
  function Params(f) {
    this.f = f; this.lam = C0 / f; this.k = 2 * PI / this.lam; this.sig = sigma(f);
    this.fm = f / 1e6;
    this.ec_re = EPS_REG; this.ec_im = -60 * this.sig * (C0 / f);
    var fm = this.fm, q = 18000 * this.sig / fm;
    this.kfac = Math.pow((EPS_REG - 1) * (EPS_REG - 1) + q * q, -0.25);
    this.ksq = Math.sqrt(EPS_REG * EPS_REG + q * q);
    this.fm13 = Math.cbrt(fm); this.fm23 = this.fm13 * this.fm13;
    this.cache = this.firstTermSetup(R_MOON);
  }
  Params.prototype.firstTermSetup = function (ae) {
    var aek = ae / 1000;
    var KH = 0.36 * Math.pow(aek * this.fm, -1 / 3) * this.kfac;
    var K = KH * this.ksq, K2 = K * K, K4 = K2 * K2;
    var beta = (1 + 1.6 * K2 + 0.67 * K4) / (1 + 4.5 * K2 + 1.53 * K4);
    return { beta: beta, Gmin: 2 + 20 * log10(K), Xf: 2.188 * beta * this.fm13 * Math.pow(aek, -2 / 3), Yf: 9.575e-3 * beta * this.fm23 * Math.pow(aek, -1 / 3) };
  };
  function firstTerm(c, d, h1, h2) {
    var X = c.Xf * (d / 1000);
    var F = X >= 1.6 ? 11 + 10 * log10(X) - 17.6 * X : -20 * log10(X) - 5.6488 * Math.pow(X, 1.425);
    return F + Gh(c, h1) + Gh(c, h2);
  }
  function Gh(c, h) {
    var B = c.beta * (c.Yf * h), g;
    if (B > 2) { var q = Math.max(B - 1.1, 1e-9); g = 17.6 * Math.sqrt(q) - 5 * log10(q) - 8; }
    else g = 20 * log10(B + 0.1 * B * B * B);
    return g > c.Gmin ? g : c.Gmin;
  }
  function sphEarth(p, d, h1, h2) {
    var ae = R_MOON, s1 = Math.sqrt(h1), s2 = Math.sqrt(h2);
    var dlos = Math.sqrt(2 * ae) * (s1 + s2);
    if (d >= dlos) return -firstTerm(p.cache, d, h1, h2);
    var c = (h1 - h2) / (h1 + h2), m = d * d / (4 * ae * (h1 + h2));
    var arg = 1.5 * c * Math.sqrt(3 * m / ((m + 1) * (m + 1) * (m + 1)));
    arg = arg < -1 ? -1 : arg > 1 ? 1 : arg;
    var b = 2 * Math.sqrt((m + 1) / (3 * m)) * Math.cos(PI / 3 + Math.acos(arg) / 3);
    var d1 = d / 2 * (1 + b), d2 = d - d1;
    var hc = ((h1 - d1 * d1 / (2 * ae)) * d2 + (h2 - d2 * d2 / (2 * ae)) * d1) / d;
    var hreq = 0.552 * Math.sqrt(Math.max(d1 * d2, 0) * p.lam / d);
    if (hc > hreq) return 0;
    var q = d / (s1 + s2), aem = 0.5 * q * q;
    var Ah = -firstTerm(p.firstTermSetup(aem), d, h1, h2);
    return Ah < 0 ? 0 : (1 - hc / hreq) * Ah;
  }

  function corrected(Luc, D) { return Luc + (1 - Math.exp(-Luc / 6)) * (10 + 0.02 * D / 1000); }

  // ---- P.526 sec. 4.5 on a single uniformly spaced profile (exact port)
  var bull = { los: false, vmax: 0, itim: 0, irim: 0, Stim: 0, Srim: 0, db: 0, vb: 0, Luc: 0, Lb: 0 };
  function bullington(z, N, D, hts, hrs, lam, ae) {
    var st = D / (N - 1), Stim = -Infinity, Srim = -Infinity, vmax = -Infinity, itim = 1, irim = 1;
    var i2ae = 1 / (2 * ae), rc = 2 * D / lam, ihD = 1 / D;
    for (var i = 1; i < N - 1; i++) {
      var d = i * st, dr = D - d, ze = z[i] + d * dr * i2ae;
      var a = (ze - hts) / d; if (a > Stim) { Stim = a; itim = i; }
      var b = (ze - hrs) / dr; if (b > Srim) { Srim = b; irim = i; }
      var hl = (hts * dr + hrs * d) * ihD;
      var v = (ze - hl) * Math.sqrt(rc / (d * dr)); if (v > vmax) vmax = v;
    }
    var Str = (hrs - hts) / D, los = Stim < Str;
    var den = los ? 1 : Math.max(Stim + Srim, 1e-12);
    var db = (hrs - hts + Srim * D) / den;
    db = db < 1e-3 ? 1e-3 : db > D - 1e-3 ? D - 1e-3 : db;
    var vb = (hts + Stim * db - (hts * (D - db) + hrs * db) / D) * Math.sqrt(2 * D / (lam * db * (D - db)));
    var Luc = los ? J(vmax) : J(vb);
    bull.los = los; bull.vmax = vmax; bull.itim = itim; bull.irim = irim; bull.Stim = Stim; bull.Srim = Srim; bull.db = db; bull.vb = vb; bull.Luc = Luc; bull.Lb = corrected(Luc, D);
    return bull;
  }

  var zero = new Float64Array(0);
  function p526(z, N, D, h_tx, h_rx, p) {
    var hts = z[0] + h_tx, hrs = z[N - 1] + h_rx, st = D / (N - 1), lam = p.lam;
    var b0 = bullington(z, N, D, hts, hrs, lam, R_MOON);
    var Lba = b0.Lb, los = b0.los, vmax = b0.vmax, itim = b0.itim, irim = b0.irim, Stim = b0.Stim, Srim = b0.Srim, db = b0.db, vb = b0.vb, Luc = b0.Luc;
    var v1 = 0, v2 = 0, hobs = -Infinity, aobt = -Infinity, aobr = -Infinity;
    for (var i = 0; i < N - 1; i++) {

  // ---- interaction

  }

  }

  function zoomAt(px, py, f) {

  }
  function clampView() {

    else drag = { kind: "pan", x: p.x, y: p.y, cx: view.cx, cy: view.cy };
  });
  function readAt(px, py, name) {
    var x = wx(px), y = wy(py), e = $("read"), r = Math.hypot(x - T.bx, y - T.by);

      var src = S.solo !== null && sim.rasters[S.solo] ? sim.rasters[S.solo] : sim.best2, m = sim.r.ceil - src[i];

  }
  cv.addEventListener("pointerleave", function () { $("read").hidden = true; });

  });
  var up = function (e) { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) drag = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", function (e) { e.preventDefault(); var p = pos(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0014)); }, { passive: false });
  cv.addEventListener("dblclick", function (e) { if (S.drawing) { finishDraw(); return; } var p = pos(e); if (!hit(p)) addNode(wx(p.x), wy(p.y)); });
  function setPlacing(on) { S.placing = on; $("add").setAttribute("aria-pressed", String(on)); $("app").classList.toggle("placing", on); if (on) hintShow("Tap the map to place the relay."); else $("hint").hidden = true; }
  var hintT = 0;
  function hintShow(t, ms) { var h = $("hint"); h.textContent = t; h.hidden = false; clearTimeout(hintT); if (ms) hintT = setTimeout(function () { h.hidden = true; }, ms); }
  function addNode(x, y) {
    if (S.nodes.length >= MAX_RELAYS) { hintShow("Twelve relays is the limit here.", 2500); return; }
    var q = { id: "R" + S.seq++, x: x, y: y, h: 1.5 }; clampDisk(q); S.nodes.push(q); S.sel = q; markStale(); renderNodes();
  }
  function renumber() { S.nodes.forEach(function (q, i) { q.id = "R" + (i + 1); }); S.seq = S.nodes.length + 1; }

  // ---- panels
  function setChip(t, c) { var e = $("chip"); e.textContent = t; e.className = "chip " + c; }
  function banner(t) { var b = document.createElement("div"); b.className = "banner"; b.setAttribute("role", "alert"); b.textContent = t; $("wrap").appendChild(b); }
  function renderValid() {
    var r = radio();
    $("budget-note").textContent = "Allowed loss " + (r.ceil - r.fade).toFixed(1) + " dB";
    $("freq-v").textContent = fmtF(r.fMHz);
    $("target-wrap").hidden = S.preset !== "free";
  }
  function renderResult() {
    var sim = S.sim; if (!sim) return;
    var n = sim.list.length, c = sim.conn.filter(Boolean).length - 1, w = Infinity, i;
    for (i = 1; i < n; i++) if (sim.conn[i]) w = Math.min(w, sim.hop[i][sim.par[i]]);
    $("r-conn").textContent = c + " of " + (n - 1);
    $("r-weak").textContent = isFinite(w) ? db(w) + " dB" : "–";
    $("r-area").textContent = sim.area.toFixed(1) + " km²";
    $("r-out").textContent = sim.route ? sim.route.out.toFixed(1) + " min" : "No route";
    $("rd").classList.toggle("dim", S.stale);
    if (!S.stale) { setChip("Up to date", "fresh"); $("stat").textContent = "Updated in " + (sim.ms / 1000).toFixed(1) + " s"; }
    else { setChip("Out of date", "stale"); $("stat").textContent = "Press Simulate to update the results."; }
  }
  function renderPlan() {
    var P = S.plan;
    $("auto").textContent = P && P.drawn ? "Find fewest relays along route" : "Find fewest relays to a point";
  }
  function nodeCard(q, i) {
    var sim = S.sim, idx = sim ? sim.list.findIndex(function (u) { return u.id === q.id; }) : -1, fresh = sim && !S.stale && idx >= 0;
    var d = document.createElement("div"); d.className = "node" + (q === S.sel ? " sel" : "");
    var sl = slopeAt(q.x, q.y), rx = (q.x - T.bx) / 1000, ry = (q.y - T.by) / 1000;
    var t = document.createElement("div"); t.className = "t";
    var id = document.createElement("span"); id.className = "id"; id.textContent = i === 0 ? "Base" : q.id; t.appendChild(id);
    var po = document.createElement("span"); po.className = "pos"; po.textContent = rx.toFixed(2).replace("-", "−") + ", " + ry.toFixed(2).replace("-", "−") + " km"; t.appendChild(po);
    d.appendChild(t);
    var st = document.createElement("div"); st.className = "st";
    var tg = function (txt, c) { var s = document.createElement("span"); s.className = "tag " + c; s.textContent = txt + "  "; st.appendChild(s); };
    tg((sl > 20 ? "▲ slope " : "slope ") + sl.toFixed(0) + "°", sl > 20 ? "bad" : "");
    if (fresh) {
      if (i > 0) {
        if (sim.conn[idx]) tg("● " + sim.depth[idx] + (sim.depth[idx] === 1 ? " hop, " : " hops, ") + db(sim.best[idx]) + " dB", "good");
        else tg("✕ no path to base", "bad");
      }
      tg(sim.nodeArea[idx].toFixed(1) + " km²", "");
      if (i > 0 && sim.conn[idx]) tg("≈ " + fmtRate(sim.chainRate[idx] * LL.hopShare(sim.depth[idx])) + " to base", "");
    }

    var c = document.createElement("div"); c.className = "ctl";

    var so = document.createElement("button"); so.className = "btn"; so.type = "button"; so.textContent = "Coverage"; so.setAttribute("aria-pressed", String(S.solo === idx && idx >= 0)); so.disabled = !fresh;

  }
  function renderNodes() { var e = $("nodes"); e.innerHTML = ""; sites().forEach(function (q, i) { e.appendChild(nodeCard(q, i)); }); }
  function renderLinks() {
    var sim = S.sim, e = $("links"); if (!sim) return;

    } else h += "<b>Terrain</b><div>5 m hillshade, 16 km disk</div>";
    if ($("t-psr").checked) h += sw("#7c5cd6", "PSRs");

  $("zin").addEventListener("click", function () { zoomAt(W / 2, H / 2, 1.5); });
  $("zout").addEventListener("click", function () { zoomAt(W / 2, H / 2, 1 / 1.5); });
  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.placing) setPlacing(false); if (e.key === "Escape" && S.drawing) setDrawing(false); if (e.key === "Escape" && S.picking) setPicking(false); if (e.key === "Enter" && S.drawing) finishDraw(); });

  });
